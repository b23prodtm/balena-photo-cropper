# nginx configuration snippet
# Add to your nginx.conf or include in server block
# File: /etc/nginx/conf.d/cropper.conf or similar

upstream cropper_service {
    server cropper:5000;
    # Fallback/retry configuration
    keepalive 32;
}

upstream web_service {
    server web:9000;  # PHP-FPM or web service
}

server {
    listen 80;
    server_name _;
    
    root /var/www/html;
    index index.php index.html index.htm;

    # Increase timeouts for cropper service
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Homepage
    location = / {
        # Try CakePHP index first, then cropper as fallback
        try_files $uri /index.php?$query_string;
    }

    # Legacy /cropper.php endpoint - route to CakePHP
    location = /cropper.php {
        try_files $uri /index.php?$query_string;
    }

    # Cropper API endpoints - route to Python service
    location ~ ^/cropper/(api|crop|upload|health|status)/ {
        proxy_pass http://cropper_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Direct /cropper path - check if file exists, else route to CakePHP
    location /cropper {
        try_files $uri @cropper_cake;
    }

    location @cropper_cake {
        rewrite ^ /index.php?$request_uri break;
        fastcgi_pass web_service;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # PHP processing for CakePHP
    location ~ \.php$ {
        fastcgi_pass web_service;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Add CROPPER_SERVICE_URL environment variable if needed
        fastcgi_param CROPPER_SERVICE_URL "http://cropper:5000";
    }

    # Static files (CSS, JS, images) - no routing needed
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to dotfiles and config files
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }

    # Health check endpoint for cropper service
    location /health {
        access_log off;
        proxy_pass http://cropper_service;
        proxy_http_version 1.0;
        proxy_set_header Connection "";
    }
}