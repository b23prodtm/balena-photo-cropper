worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;

    # 🔥 IMPORTANT: max upload size for PDF/TIFF/JPG
    client_max_body_size 100M;

    upstream php {
        server web:9000;
    }

    upstream cropper_service {
        server cropper:5000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /var/www/html/webroot;
        index index.php;

        # Timeouts for cropper service
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Health check endpoint for cropper service
        location /health {
            access_log off;
            proxy_pass http://cropper_service;
            proxy_http_version 1.0;
            proxy_set_header Connection "";
        }

        # Cropper API endpoints - route to Python Flask service
        location ~ ^/cropper/(api|crop|upload|process|status)/ {
            proxy_pass http://cropper_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Direct /cropper path - route through CakePHP
        location /cropper {
            try_files $uri @cropper_cake;
        }

        location @cropper_cake {
            rewrite ^ /index.php?$request_uri break;
            fastcgi_pass php;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param CROPPER_SERVICE_URL "http://cropper:5000";
        }

        # Main routing (CakePHP)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM handler
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # Cache static assets
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff|woff2)$ {
            expires 7d;
            access_log off;
        }

        # Deny access to dotfiles and config files
        location ~ /\. {
            deny all;
        }

        location ~ ~$ {
            deny all;
        }
    }
}