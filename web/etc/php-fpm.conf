[global]
; Niveau de détail des logs
log_level = notice

; Limite la taille des logs
log_limit = 8192

; Chemin vers le fichier de log principal
;error_log = /var/www/cakephp/app/logs/php-fpm.log

; Utiliser syslog (optionnel)
; syslog.facility = daemon
; syslog.ident = php-fpm

[www]

user = www-data
group = www-data

; Listen to IPv4 0.0.0.0
listen = 0.0.0.0:9000
;listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

catch_workers_output = yes

clear_env = no

; Important for long PDF/TIFF processing
request_terminate_timeout = 300s
