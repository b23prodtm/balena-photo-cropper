build-secrets:
  global:
    - source: mysql_password_file
      dest: mysql_password
    - source: mysql_root_password_file
      dest: mysql_root_password
    - source: ssl_key_file
      dest: ssl_key
    - source: ssl_crt_file
      dest: ssl_crt
    - source: security_salt_file
      dest: security_salt
