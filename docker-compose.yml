# docker-compose.yml - Configuration mise à jour avec cropper + web CakePHP3

version: '3.8'

services:
  # Nginx - Reverse proxy et routeur
  nginx:
    image: balena/rpi-nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./services/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - cropper
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - photo-cropper

  # Service Web - CakePHP3
  web:
    image: balena/rpi-php:7.4-fpm
    container_name: photo-cropper-web
    volumes:
      - ./services/web:/var/www/html
      - ./services/php/php-fpm.conf:/etc/php/7.4/fpm/php-fpm.conf:ro
    environment:
      # CakePHP configuration
      DB_DRIVER: Mysql
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USERNAME: "cropper_user"
      DB_PASSWORD: "${DB_PASSWORD:-change-me}"
      DB_DATABASE: "photo_cropper"
      
      # Cropper service endpoint
      CROPPER_SERVICE_URL: "http://cropper:5000"
      
      # PHP configuration
      MEMORY_LIMIT: "256M"
      UPLOAD_MAX_FILESIZE: "100M"
      POST_MAX_SIZE: "100M"
    depends_on:
      - cropper
      - db
    networks:
      - photo-cropper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Service Cropper - Python + OpenCV
  cropper:
    image: balena/rpi-python:3.11
    container_name: photo-cropper-service
    build:
      context: ./services/cropper
      dockerfile: Dockerfile
    volumes:
      - cropper_tmp:/tmp
      - cropper_uploads:/app/uploads
    environment:
      FLASK_ENV: "production"
      FLASK_APP: "app.py"
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "INFO"
      
      # Cropper configuration
      MAX_FILE_SIZE: "100M"
      ALLOWED_FORMATS: "jpg,jpeg,png,gif,webp"
    depends_on:
      - redis
    networks:
      - photo-cropper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Database - MySQL (optionnel, pour CakePHP)
  db:
    image: balena/rpi-mysql:5.7
    container_name: photo-cropper-db
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root-password}"
      MYSQL_DATABASE: "photo_cropper"
      MYSQL_USER: "cropper_user"
      MYSQL_PASSWORD: "${DB_PASSWORD:-change-me}"
    volumes:
      - db_data:/var/lib/mysql
      - ./services/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - photo-cropper
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - Cache (optionnel, pour session/cache CakePHP)
  redis:
    image: balena/rpi-redis:7-alpine
    container_name: photo-cropper-cache
    volumes:
      - redis_data:/data
    networks:
      - photo-cropper
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

# Volumes
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  cropper_tmp:
    driver: local
  cropper_uploads:
    driver: local

# Networks
networks:
  photo-cropper:
    driver: bridge