#version: '2.1'
services:
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - web
    mem_limit: 64m
    mem_reservation: 32m
    restart: unless-stopped
    # PR #9: attend que web soit prêt avant de servir
    command: >
      sh -c "/wait-for-it.sh web:80 -t 60 -- 
      nginx -g 'daemon off;'"
    volumes:
      - ./certs:/etc/nginx/ssl:ro

  web:
    build: ./web
    depends_on:
      - cropper
    environment:
      - PHP_FPM_PM=ondemand
      - PHP_FPM_MAX_CHILDREN=2
      - PHP_FPM_MAX_REQUESTS=100
    mem_limit: 128m
    mem_reservation: 64m
    restart: unless-stopped
    # PR #9: attend que cropper Flask soit ready
    command: >
      sh -c "/wait-for-it.sh cropper:5000 -t 120 --
      php-fpm"

  cropper:
    build: ./cropper
    ports:
      - "5000:5000"
    volumes:
      - 'resin-data:/data'
    mem_limit: 450m
    mem_reservation: 200m
    restart: unless-stopped

volumes:
  resin-data:
  certs: