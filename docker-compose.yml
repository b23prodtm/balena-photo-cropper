version: '3.8'

services:
  cropper:
    # Images générées par docker-bake (multi-platform)
    image: bprtkop/balena-photo-cropper-api:latest
    build:
      context: ./cropper
      dockerfile: Dockerfile
    container_name: balena-photo-cropper-api
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - cropper_uploads:/app/uploads
      - cropper_tmp:/tmp
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python3", "-c", "import cv2; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - photo-cropper

  web:
    image: bprtkop/balena-photo-cropper-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: balena-photo-cropper-web
    restart: always
    depends_on:
      cropper:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ./web:/var/www/html
    environment:
      CROPPER_URL: http://cropper:5000
      UPLOAD_MAX_FILESIZE: 100M
      POST_MAX_SIZE: 120M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: 300
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - photo-cropper

  nginx:
    image: bprtkop/balena-photo-cropper-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: balena-photo-cropper-nginx
    restart: always
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./web/webroot:/var/www/html:ro
    environment:
      SSL_KEY: ""
      SSL_CRT: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - photo-cropper

volumes:
  cropper_uploads:
  cropper_tmp:

networks:
  photo-cropper:
    driver: bridge