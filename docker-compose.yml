version: '2.1'

services:
  cropper:
    # On utilise l'image générée par le build bake
    image: bprtkop/balena-photo-cropper-api:latest
    build: 
      context: ./cropper
      dockerfile: Dockerfile
    privileged: true
    restart: always
    ports:
      - "5000:5000"

  web:
    image: bprtkop/balena-photo-cropper-web:latest
    build: 
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - cropper
    ports:
      - "80:80"
    restart: always
