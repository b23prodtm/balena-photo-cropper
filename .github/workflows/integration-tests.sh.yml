name: Integration Tests (Balena Cloud Pre-Flight Check)

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - balena_arch: x86_64
            platform: linux/amd64

    permissions:
      contents: read
      checks: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Enable QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ matrix.platform }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pillow requests

    - name: Enable Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@v1
      with:
        version: latest
        platform: ${{ matrix.platform }}

    - name: Display environment info
      run: |
        python3 --version
        docker --version
        docker compose --version
        curl --version

    - name: Check tests directory
      run: |
        ls -la tests/
        for f in generate_test_images.py test_cropper_flask.py test_interactive_cropper.py test_cakephp_routes.sh run_integration_tests.sh; do
          [ -f tests/$f ] && echo "✅ $f found" || echo "❌ $f missing"
        done
        
    - name: Generate SSL certificates
      run: |
        mkdir -p certs
        openssl req -x509 -newkey rsa:4096 -keyout certs/server.key -out certs/server.crt -days 365 -nodes -subj "/CN=localhost"
        
    - name: Make test scripts executable
      run: |
        chmod +x tests/*.sh
        
    - name: Create .balena/secrets directory with GitHub secrets
      run: |
        mkdir -p .balena/secrets
        cp certs/server.key .balena/secrets/ssl_key
        cp certs/server.crt .balena/secrets/ssl_crt
        echo "${{ secrets.DB_PASSWORD }}" > .balena/secrets/mysql_password
        echo "${{ secrets.DB_ROOT_PASSWORD }}" > .balena/secrets/mysql_root_password
        chmod 600 .balena/secrets/*
        echo "✅ Secrets created successfully"
        ls -la .balena/secrets/

    - name: Build all services with Bake
      uses: docker/bake-action@v5
      with:
        files: ./docker-bake.hcl
        targets: ${{ matrix.balena_arch }}
        load: true

    # ============================================================
    # PRE-FLIGHT CHECK: OpenCV + FFmpeg inside cropper container
    # ============================================================
    - name: Pre-flight check OpenCV + FFmpeg availability
      run: |
        echo "=== Pre-flight: Checking OpenCV + FFmpeg ==="

        ln -sf docker-compose.${{ matrix.balena_arch }} docker-compose.yml
        ln -sf ${{ matrix.balena_arch }}.env .env

        docker compose up -d cropper
        sleep 10

        echo "--- FFmpeg libs / binary ---"
        docker compose exec cropper sh -c "ffmpeg -version"

        echo "--- OpenCV import ---"
        docker compose exec cropper sh -c "/opt/venv/bin/python -c 'import cv2; print(\"OpenCV OK:\", cv2.__version__)'"

        echo "=== Pre-flight check OK ==="

    # ============================================================
    # PRE-FLIGHT CHECK: Secrets Passing at Build & Runtime
    # ============================================================
    - name: Pre-flight check Secrets passed to build and runtime
      run: |
        echo "=== Pre-flight: Checking Secrets Availability ==="
        
        # Verify secrets exist on host
        echo "--- Host-side secrets ---"
        [ -f .balena/secrets/mysql_password ] && echo "✅ mysql_password exists" || echo "❌ mysql_password missing"
        [ -f .balena/secrets/mysql_root_password ] && echo "✅ mysql_root_password exists" || echo "❌ mysql_root_password missing"
        
        # Start all required services
        echo "--- Starting services with secrets ---"
        docker compose up -d cropper web mysqldb nginx
        sleep 15
        
        echo "--- Container-side secrets check (db service) ---"
        docker compose exec mysqldb sh -c "
          if [ -f /run/secrets/MYSQL_PASSWORD ]; then
            echo '✅ /run/secrets/MYSQL_PASSWORD exists in db container'
            wc -c < /run/secrets/MYSQL_PASSWORD
          else
            echo '❌ /run/secrets/MYSQL_PASSWORD NOT found in db container'
            exit 1
          fi
        " || exit 1
        
        echo "--- Container-side secrets check (web service) ---"
        docker compose exec web sh -c "
          if [ -f /run/secrets/MYSQL_PASSWORD ]; then
            echo '✅ /run/secrets/MYSQL_PASSWORD exists in web container'
            wc -c < /run/secrets/MYSQL_PASSWORD
          else
            echo '❌ /run/secrets/MYSQL_PASSWORD NOT found in web container'
            exit 1
          fi
        " || exit 1
        
        echo "=== Pre-flight secrets check OK ==="

    # ============================================================
    # PRE-FLIGHT CHECK: Nginx + SSL Certificates
    # ============================================================
    - name: Pre-flight check Nginx SSL and routing
      run: |
        echo "=== Pre-flight: Checking Nginx SSL & Routing ==="
        
        echo "--- Nginx container status ---"
        docker compose ps nginx
        
        echo "--- Nginx configuration test ---"
        docker compose exec nginx nginx -t
        
        echo "--- Checking Nginx SSL certificates ---"
        docker compose exec nginx sh -c "
          if [ -f /etc/nginx/ssl/server.crt ] && [ -f /etc/nginx/ssl/server.key ]; then
            echo '✅ SSL certificates found'
            openssl x509 -in /etc/nginx/ssl/server.crt -noout -dates
          else
            echo '❌ SSL certificates NOT found'
            echo 'Looking for certs in /etc/nginx/ssl/:'
            ls -la /etc/nginx/ssl/ 2>/dev/null || echo 'Directory does not exist'
            exit 1
          fi
        " || exit 1
        
        echo "--- Nginx listening ports ---"
        docker compose exec nginx sh -c "nc -z localhost 80; port80=$?; nc -z localhost 443; port443=$?; [ $port80 -eq 0 ] && [ $port443 -eq 0 ]"
        
        echo "--- Testing Nginx health endpoint ---"
        sleep 5
        curl -s http://localhost:8080/health || echo "Health check on :8080 (HTTP redirect)"
        
        echo "=== Pre-flight Nginx check OK ==="

    # ============================================================
    # START ONLY REQUIRED SERVICES FOR TESTS
    # ============================================================
    - name: Start required services
      run: |
        ln -sf docker-compose.${{ matrix.balena_arch }} docker-compose.yml
        ln -sf ${{ matrix.balena_arch }}.env .env
        docker compose up -d cropper web mysqldb nginx
        docker compose ps
        sleep 10

    - name: Run integration tests
      id: integration-tests
      continue-on-error: true
      run: |
        bash tests/run_integration_tests.sh > test_output.log 2>&1
        TEST_EXIT_CODE=$?
        echo "Integration tests exit code: ${TEST_EXIT_CODE}"
        exit ${TEST_EXIT_CODE}
      timeout-minutes: 90
      env:
        HEADLESS_MODE: true

    - name: Docker compose logs
      if: always()
      run: |
        docker compose logs cropper || true
        docker compose logs web || true
        docker compose logs nginx || true
        [ -f test_output.log ] && cat test_output.log

    - name: Capture failure result
      if: steps.integration-tests.outcome == 'failure'
      run: |
        docker compose logs --no-color > docker-compose-failure.log || true

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v || true
        docker system prune -f || true

    - name: Test Report
      if: always()
      run: |
        echo "## 🧪 Integration Test Results" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.integration-tests.outcome }}" == "success" ]; then
          echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          echo "- Flask API routes" >> $GITHUB_STEP_SUMMARY
          echo "- CakePHP web routes" >> $GITHUB_STEP_SUMMARY
          echo "- CLI tool functionality" >> $GITHUB_STEP_SUMMARY
          echo "- Nginx SSL routing" >> $GITHUB_STEP_SUMMARY
          echo "- Docker secrets propagation" >> $GITHUB_STEP_SUMMARY
          echo "Ready for Balena Cloud deployment!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          echo "Check logs above." >> $GITHUB_STEP_SUMMARY
        fi
