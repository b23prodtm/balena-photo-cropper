name: Docker Build Multi-Platform

# Déclencher le build sur:
on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: bprtkop
  GIT_SHA: ${{ github.sha }}
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up QEMU for multi-arch builds
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/amd64,linux/arm/v7,linux/arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm/v7,linux/arm64

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      if: github.event_name != 'pull_request'

    - name: Extract metadata
      id: meta
      run: |
        echo "SHORT_SHA=${GIT_SHA:0:7}" >> $GITHUB_OUTPUT
        echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

    - name: Build and push with Bake (Full Multi-Platform)
      uses: docker/bake-action@v5
      with:
        workdir: .
        files: |
          ./docker-bake.hcl
        targets: default
        push: ${{ github.event_name != 'pull_request' }}
        set: |
          *.args.BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
          *.args.VCS_REF=${{ steps.meta.outputs.SHORT_SHA }}
          *.cache-from=type=gha
          *.cache-to=type=gha,mode=max
      env:
        GIT_SHA: ${{ env.GIT_SHA }}
        TAG: ${{ env.TAG }}

    - name: Build (AMD64 only for PR testing)
      if: github.event_name == 'pull_request'
      uses: docker/bake-action@v5
      with:
        workdir: .
        files: |
          ./docker-bake.hcl
        targets: amd64-only
        push: false
        set: |
          *.cache-from=type=gha
          *.cache-to=type=gha,mode=max

    - name: Log build results
      if: always()
      run: |
        echo "Build completed at $(date)"
        echo "Platforms: linux/amd64, linux/arm/v7, linux/arm64"
        echo "Push enabled: ${{ github.event_name != 'pull_request' }}"

    - name: Check image health
      if: github.event_name != 'pull_request'
      run: |
        echo "✅ Build completed successfully"
        echo "Images pushed to Docker Hub:"
        echo "  - bprtkop/balena-photo-cropper-api:latest"
        echo "  - bprtkop/balena-photo-cropper-web:latest"
        echo "  - bprtkop/balena-photo-cropper-nginx:latest"