name: Docker Build Multi-Platform

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-services:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - balena_arch: armhf
            platform: linux/arm/v7
            dockerfile: Dockerfile.armhf
          - balena_arch: aarch64
            platform: linux/arm64
            dockerfile: Dockerfile.aarch64
          - balena_arch: x86_64
            platform: linux/amd64
            dockerfile: Dockerfile.x86_64

    steps:
      - uses: actions/checkout@v4
      
      - name: Sanitize ref name
        id: ref
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
          # Docker-safe normalization:
          SAFE_REF=$(echo "$RAW_REF" \
            | tr '/' '-' \
            | tr ':' '-' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]//g')
          echo "safe_ref=$SAFE_REF" >> $GITHUB_OUTPUT
          
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push cropper for ${{ matrix.balena_arch }}
        uses: docker/bake-action@v5
        env:
          GITHUB_SHA: ${{ steps.ref.outputs.short_sha }}
          BAKE_TAG: ${{ steps.ref.outputs.safe_ref }}
        with:
          files: ./docker-bake.hcl
          targets: cropper-${{ matrix.balena_arch }}
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.args.BALENA_ARCH=${{ matrix.balena_arch }}
            *.platform=${{ matrix.platform }}

  build-web:
    needs: build-services
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      
      - name: Sanitize ref name
        id: ref
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
          SAFE_REF=$(echo "$RAW_REF" \
            | tr '/' '-' \
            | tr ':' '-' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]//g')
          echo "safe_ref=$SAFE_REF" >> $GITHUB_OUTPUT
          
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web service
        uses: docker/bake-action@v5
        env:
          GITHUB_SHA: ${{ steps.ref.outputs.short_sha }}
          BAKE_TAG: ${{ steps.ref.outputs.safe_ref }}
        with:
          files: ./docker-bake.hcl
          targets: web
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
