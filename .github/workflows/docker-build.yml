name: Docker Build Multi-Platform with Manifest Merge

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-services:

    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    
    permissions:
      contents: write
      packages: write
      pull-requests: write
    
    strategy:
      fail-fast: false
      matrix:     
        arch: [ x86_64, aarch64, armhf ]
    steps:
      - uses: actions/checkout@v4
      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sanitize ref name for Docker tag
        id: sanitize
        run: |
          RAW="${{ github.ref_name }}"
          TAG=$(echo "$RAW" | tr '[:upper:]' '[:lower:]')
          TAG=$(echo "$TAG" | sed 's/[^a-z0-9._-]/-/g')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Build docker-compose stack
        env:
          BALENA_ARCH: ${{ matrix.arch }}
          BAKE_TAG: ${{ steps.sanitize.outputs.tag }}
        run: |
          case "${BALENA_ARCH}" in
            "armhf")    export PLATFORM="linux/arm/v7"  ;;
            "aarch64")  export PLATFORM="linux/arm64"   ;;
            "x86_64")   export PLATFORM="linux/amd64"   ;;
            *)          export PLATFORM="linux/$(uname -m)" ;;
          esac
          ln -sf "${BALENA_ARCH}.env" ".env"
          cp -vf "docker-compose.${BALENA_ARCH}" "docker-compose.yml"       
          
          echo "${{ secrets.DB_ROOT_PASSWORD }}" > .balena/secrets/db_root_password
          echo "${{ secrets.DB_PASSWORD }}" > .balena/secrets/db_password
          
          docker buildx bake -f docker-bake.hcl \
            --set "*.dockerfile=Dockerfile.${BALENA_ARCH}" \
            --set "*.platform=${PLATFORM}" \
            --push
      - name: Push multi-platform manifests
        env:
          BAKE_TAG: ${{ steps.sanitize.outputs.tag }}
        run: |
          if "./manifest-push.sh"; then
              echo "✅ All manifests pushed successfully"
          else
              echo "❌ Manifest push failed"
              exit 1
          fi
          
  deploy:
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    
    needs: build-services
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Deploy stack
        env:
          BAKE_TAG: ${{ github.ref_name }}
        run: docker compose up -d
