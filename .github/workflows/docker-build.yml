name: Docker Build Multi-Platform with Manifest Merge

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-services:
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - balena_arch: armhf
            platform: linux/arm/v7
          - balena_arch: aarch64
            platform: linux/arm64
          - balena_arch: x86_64
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v4
      - name: Sanitize ref name
        id: ref
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
      
          # Docker-safe normalization:
          SAFE_REF=$(echo "$RAW_REF" \
            | tr '/' '-' \
            | tr ':' '-' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]//g')
      
          echo "RAW_REF=$RAW_REF"
          echo "SAFE_REF=$SAFE_REF"
      
          echo "safe_ref=$SAFE_REF" >> $GITHUB_OUTPUT

      - name: Load Balena architecture
        id: balena
        run: |
          source ./${{ matrix.balena_arch }}.env

          echo "balena_arch=${BALENA_ARCH}" >> $GITHUB_OUTPUT
          echo "platform=${PLATFORM}" >> $GITHUB_OUTPUT
          echo "bake_tag=${{ steps.ref.outputs.safe_ref }}.${BALENA_ARCH}" >> $GITHUB_OUTPUT
          echo "dockerfile=Dockerfile.${BALENA_ARCH}" >> $GITHUB_OUTPUT

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build service image
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: default
          push: true
          set: |
            *.platform=${{ steps.balena.outputs.platform }}
            *.dockerfile=${{ steps.balena.outputs.dockerfile }}
            *.args.BAKE_TAG=${{ steps.balena.outputs.bake_tag }}
            *.args.GITHUB_SHA=${{ steps.balena.outputs.github_sha }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
          
  deploy:
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    
    needs: build-services
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: Sanitize ref name
        id: ref
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
      
          # Docker-safe normalization:
          SAFE_REF=$(echo "$RAW_REF" \
            | tr '/' '-' \
            | tr ':' '-' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]//g')
      
          echo "RAW_REF=$RAW_REF"
          echo "SAFE_REF=$SAFE_REF"
      
          echo "safe_ref=$SAFE_REF" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Push multi-platform manifests
        env:
          GITHUB_SHA: ${{ steps.meta.outputs.short_sha }}
          BAKE_TAG: ${{ steps.ref.outputs.safe_ref }}
        run: |
          if "./manifest-push.sh"; then
              echo "✅ All manifests pushed successfully"
          else
              echo "❌ Manifest push failed"
              exit 1
          fi
      - name: Deploy stack
        run: docker compose up -d
