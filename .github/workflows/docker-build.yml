name: Docker Build Multi-Platform with Manifest Merge

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-services:

    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    
    permissions:
      contents: write
      packages: write
      pull-requests: write
    
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          
          # PR build: Add PR reference
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER=${{ github.event.pull_request.number }}
            echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_OUTPUT
            echo "TAG_SUFFIX=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
            echo "PUSH_ENABLED=false" >> $GITHUB_OUTPUT
          else
            echo "TAG_SUFFIX=latest" >> $GITHUB_OUTPUT
            echo "PUSH_ENABLED=true" >> $GITHUB_OUTPUT
          fi
      - name: Build with Bake (each platform separately)
        uses: docker/bake-action@v5
        with:
          workdir: .
          files: |
            ./docker-bake.hcl
          targets: default
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.args.BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
            *.args.VCS_REF=${{ steps.meta.outputs.SHORT_SHA }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          GIT_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          
      - name: Push multi-platform manifests
        env:
          BAKE_TAG: ${{ github.ref_name }}
        run: |
          if "./manifest-push.sh"; then
              echo "✅ All manifests pushed successfully"
          else
              echo "❌ Manifest push failed"
              exit 1
          fi
          
  deploy:
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    
    needs: build-services
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Deploy stack
        env:
          BAKE_TAG: ${{ github.ref_name }}
        run: docker compose up -d
