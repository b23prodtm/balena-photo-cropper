name: Docker Build Multi-Platform with Manifest Merge

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-services:
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - balena_arch: armhf
            platform: linux/arm/v7
          - balena_arch: aarch64
            platform: linux/arm64
          - balena_arch: x86_64
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v4
      
      - name: Sanitize ref name
        id: ref
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
      
          # Docker-safe normalization:
          SAFE_REF=$(echo "$RAW_REF" \
            | tr '/' '-' \
            | tr ':' '-' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]//g')

          echo "safe_ref=$SAFE_REF" >> $GITHUB_OUTPUT
          
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build service image for ${{ matrix.balena_arch }}
        uses: docker/bake-action@v5
        env:
          GITHUB_SHA: ${{ steps.ref.outputs.short_sha }}
          BAKE_TAG: ${{ steps.ref.outputs.safe_ref }}
        with:
          files: ./docker-bake.hcl
          targets: ${{ matrix.balena_arch }}
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.args.BALENA_ARCH=${{ matrix.balena_arch }}
            *.platform=${{ matrix.platform }}
          
  deploy:
    needs: build-services
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - balena_arch: armhf
            platform: linux/arm/v7

    steps:
      - uses: actions/checkout@v4
      
      - name: Sanitize ref name
        id: ref
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
      
          # Docker-safe normalization:
          SAFE_REF=$(echo "$RAW_REF" \
            | tr '/' '-' \
            | tr ':' '-' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]//g')

          echo "safe_ref=$SAFE_REF" >> $GITHUB_OUTPUT
          
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: Push multi-platform manifests
        env:
          GITHUB_SHA: ${{ steps.ref.outputs.short_sha }}
          BAKE_TAG: ${{ steps.ref.outputs.safe_ref }}
        run: |
          if "./manifest-push.sh"; then
              echo "✅ All manifests pushed successfully"
          else
              echo "❌ Manifest push failed"
              exit 1
          fi
          
      - name: Deploy stack
        run: |
          ln -sf docker-compose.${{ matrix.balena_arch }} docker-compose.yml
          ln -sf ${{ matrix.balena_arch }}.env .env
          docker compose up -d
