name: Docker Build Multi-Platform

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
jobs:
  build-services:
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - balena_arch: armhf
            platform: linux/arm/v7
          - balena_arch: aarch64
            platform: linux/arm64
          - balena_arch: x86_64
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v4      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sanitize ref name
        id: ref
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
      
          # Docker-safe normalization:
          SAFE_REF=$(echo "$RAW_REF" \
            | tr '/' '-' \
            | tr ':' '-' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]//g')

          echo "safe_ref=$SAFE_REF" >> $GITHUB_OUTPUT
          
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Materialize build secrets for bake
        run: |
          mkdir -p .balena/secrets
          printf '%s' "${{ secrets.mysql_root_password }}" > .balena/secrets/mysql_root_password_file
          printf '%s' "${{ secrets.mysql_password }}" > .balena/secrets/mysql_password_file
          printf '%s' "${{ secrets.security_salt }}" > .balena/secrets/security_salt_file
          printf '%s' "${{ secrets.ssl_key}}" > .balena/secrets/ssl_key_file
          printf '%s' "${{ secrets.ssl_crt }}" > .balena/secrets/ssl_crt_file
          chmod 600 .balena/secrets/mysql_root_password_file .balena/secrets/mysql_password_file \
          .balena/secrets/ssl_key_file .balena/secrets/ssl_crt_file 
    
      - name: Build service image for ${{ matrix.balena_arch }}
        uses: docker/bake-action@v5
        env:
          GITHUB_SHA: ${{ steps.ref.outputs.short_sha }}
          BAKE_TAG: ${{ steps.ref.outputs.safe_ref }}
        with:
          files: ./docker-bake.hcl
          targets: ${{ matrix.balena_arch }}
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.args.BALENA_ARCH=${{ matrix.balena_arch }}
            *.platform=${{ matrix.platform }}
          
  deploy:
    needs: build-services
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - balena_arch: armhf
            platform: linux/arm/v7

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20      
      - name: Sanitize ref name
        id: ref
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
      
          # Docker-safe normalization:
          SAFE_REF=$(echo "$RAW_REF" \
            | tr '/' '-' \
            | tr ':' '-' \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]//g')

          echo "safe_ref=$SAFE_REF" >> $GITHUB_OUTPUT
          
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: Push multi-platform manifests
        env:
          GITHUB_SHA: ${{ steps.ref.outputs.short_sha }}
          BAKE_TAG: ${{ steps.ref.outputs.safe_ref }}
        run: |
          if "./manifest-push.sh"; then
              echo "✅ All manifests pushed successfully"
          else
              echo "❌ Manifest push failed"
              exit 1
          fi
          
      # The armhf stack is built and run on the device itself, through balena
      # (balena_deploy ... 1 = armhf, 2 = Balena Cloud flavour). It cannot be
      # started with `docker compose up` on this x86_64 runner: that rebuilt every
      # image from scratch with no platform, build args or build secrets.
      # Here we only run the same template filtering as balena_deploy and
      # validate what it generates.
      - name: Generate Balena files for ${{ matrix.balena_arch }} (balena_deploy)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          npm ci --no-audit --no-fund
          export PATH="$PWD/node_modules/.bin:$PATH"
          export USER="${USER:-runner}"
          mkdir -p "$HOME/.ssh"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Filters Dockerfile.template, docker-compose.template and <arch>.env
          # (same as: balena_deploy ./ 1 2 0 for armhf). No balena CLI here, so
          # the final push is skipped by the script.
          balena_deploy ./ "${{ matrix.balena_arch }}" 2 0

      - name: Validate generated Balena compose file
        run: |
          COMPOSE_FILE="docker-compose.${{ matrix.balena_arch }}"
          docker compose -f "$COMPOSE_FILE" --env-file "${{ matrix.balena_arch }}.env" config -q
          # Balena Cloud has no compose-level secrets (they come from .balena/balena.yml)
          if grep -nE '^\s*secrets:' "$COMPOSE_FILE"; then
            echo "::error::$COMPOSE_FILE still has a secrets block; Balena filter was not applied"
            exit 1
          fi
