name: Docker Build Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bprtkop
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bprtkop/balena-photo-cropper
          tags: |
            # Tag 'latest' uniquement sur la branche main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag avec le nom de la branche pour les autres (ex: gemini)
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

    - name: Build Cropper (ARM v7)
      uses: docker/build-push-action@v5
      with:
        context: ./cropper
        platforms: linux/arm/v7
        push: true
        tags: ${{ id.meta.outputs.tags }}
        labels: ${{ id.meta.outputs.labels }}
        # Fix: Install build tools inside the Docker image
        pre-build: |
          # Install necessary build tools
          apt-get update && apt-get install -y build-essential gcc g++ make libffi-dev libssl-dev python3-dev
        
          # Set up Python environment
          python3 -m pip install --upgrade pip setuptools wheel numpy==1.26.0
        
          # Install numpy first separately to ensure wheels are built, then the other requirements
          pip install -r requirements.txt

    - name: Build Web (ARM v7)
      uses: docker/build-push-action@v5
      with:
        context: ./web
        platforms: linux/arm/v7
        push: true
        tags: ${{ id.meta.outputs.tags }}
        labels: ${{ id.meta.outputs.labels }}
