name: Docker Build Multi-Platform with Manifest Merge

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-services:

    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    
    permissions:
      contents: write
      packages: write
      pull-requests: write
    
    strategy:
      fail-fast: false
      matrix:     
        arch: [ x86_64, aarch64, armhf ]
    steps:
      - uses: actions/checkout@v4
      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sanitize ref name for Docker tag
        id: sanitize
        run: |
          RAW="${{ github.ref_name }}"
          TAG=$(echo "$RAW" | tr '[:upper:]' '[:lower:]')
          TAG=$(echo "$TAG" | sed 's/[^a-z0-9._-]/-/g')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Build docker-compose stack
        env:
          BALENA_ARCH: ${{ matrix.arch }}
          BAKE_TAG: ${{ steps.sanitize.outputs.tag }}
        run: |
          case "${BALENA_ARCH}" in
            "armhf")    export PLATFORM="linux/arm/v7"  ;;
            "aarch64")  export PLATFORM="linux/arm64"   ;;
            "x86_64")   export PLATFORM="linux/amd64"   ;;
            *)          export PLATFORM="linux/$(uname -m)" ;;
          esac
          ln -sf "${BALENA_ARCH}.env" ".env"
          cp -vf "docker-compose.${BALENA_ARCH}" "docker-compose.yml"       
          
          echo "${{ secrets.DB_ROOT_PASSWORD }}" > .balena/secrets/db_root_password
          echo "${{ secrets.DB_PASSWORD }}" > .balena/secrets/db_password
          
          docker buildx bake -f docker-bake.hcl \
            --set "*.dockerfile=Dockerfile.${BALENA_ARCH}" \
            --set "BAKE_TAG=${BAKE_TAG}" \
            --set "*.platform=${PLATFORM}" \
            --push

  deploy:
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    
    needs: build-services
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Deploy stack
        env:
          BAKE_TAG: ${{ github.ref_name }}
        run: docker compose up -d

      - name: Log build results
        if: always()
        run: |
          echo "Build completed at $(date)"         
          echo "Platforms: linux/amd64, linux/arm/v7, linux/arm64"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR Build: #${{ steps.meta.outputs.PR_NUMBER }}"
            echo "Push: disabled (PR)"
          else
            echo "Push: enabled (main branch)"
            echo "Manifests: merged without rebuild ✅"
          fi

      - name: Comment PR with build info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Docker Build Results\n\n**PR:** #${{ steps.meta.outputs.PR_NUMBER }}\n**Commit:** ${{ steps.meta.outputs.SHORT_SHA }}\n**Status:** Build successful)\n\nFull multi-platform manifest will be created when merged to main.`
            })

      - name: Verify manifests
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Multi-platform manifests created and pushed"
          echo ""
          echo "Available images:"
          echo "  - ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}/balena-photo-cropper-api:${{ github.ref_name }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}/balena-photo-cropper-web:${{ github.ref_name }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}/balena-photo-cropper-nginx:${{ github.ref_name }}"
          echo ""
          echo "Architectures supported:"
          echo "  - linux/amd64"
          echo "  - linux/arm/v7 (Raspberry Pi 32-bit)"
          echo "  - linux/arm64 (Raspberry Pi 4B 64-bit)"
          echo ""
          echo "docker-compose.yml can now pull these multi-platform images:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}/balena-photo-cropper-api:${{ github.ref_name }}"