name: Docker Build Multi-Platform with Manifest Merge

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
    build-services:
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - balena_arch: armhf
            platform: linux/arm/v7
          - balena_arch: aarch64
            platform: linux/arm64
          - balena_arch: x86_64
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v4

      - name: Load Balena architecture
        id: balena
        run: |
          source ./${{ matrix.balena_arch }}.env

          echo "BALENA_ARCH=${BALENA_ARCH}" >> $GITHUB_OUTPUT
          echo "PLATFORM=${PLATFORM}" >> $GITHUB_OUTPUT

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build service image
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: default
          push: true
          set: |
            *.platform=${{ steps.balena.outputs.PLATFORM }}
            *.args.DOCKERFILE=Dockerfile.${{ steps.balena.outputs.BALENA_ARCH }}
            *.tags=${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}/${{ matrix.service }}:${{ github.ref_name }}-${{ matrix.balena_arch }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          GITHUB_SHA: ${{ github.sha }}
          BAKE_TAG: ${{ github.ref_name }}
          
      - name: Push multi-platform manifests
        env:
          GITHUB_SHA: ${{ github.sha }}
          BAKE_TAG: ${{ github.ref_name }}
        run: |
          if "./manifest-push.sh"; then
              echo "✅ All manifests pushed successfully"
          else
              echo "❌ Manifest push failed"
              exit 1
          fi
          
  deploy:
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    
    needs: build-services
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Deploy stack
        env:
          BAKE_TAG: ${{ github.ref_name }}
        run: docker compose up -d
